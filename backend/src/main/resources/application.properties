server.port=${PORT:8080}
spring.application.name=rgsenterprisesbackend

# Database Configuration (Supabase PostgreSQL via Session Pooler)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.ekkoeycylhhxykepbikl}
spring.datasource.password=${DB_PASSWORD:RGS-enterprises@1}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator for Health checks (Render deployment)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Multipart File Upload (Max 5MB as required)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Initial Admin Credentials
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Supabase Storage Configuration
app.supabase.url=${SUPABASE_URL:https://ekkoeycylhhxykepbikl.supabase.co}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:sb_publishable_eUvog9Tlihv-uPTvLV6LGQ_tRRLHMNQ}
app.supabase.storage-bucket=${STORAGE_BUCKET:godown-documents}

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# OpenAPI Doc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
